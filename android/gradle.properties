org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Disable native file system ops — fixes "Could not get file mode" on Windows
org.gradle.native=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable incremental Kotlin compilation — fixes cross-drive path errors on Windows (project on D:, Pub cache on C:)
kotlin.incremental=false
# Suppress JVM target mismatch errors from third-party plugins (tflite_flutter uses Java 1.8 with Kotlin 21)
kotlin.jvm.target.validation.mode=IGNORE
